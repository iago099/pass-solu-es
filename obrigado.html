<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sucesso! | Pass Soluções</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css"/>
    <style>
        :root {
            --primary: #6a0dad;
            --accent: #00e676;
            --dark: #050505;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Poppins', sans-serif; }
        body { background: var(--dark); color: white; height: 100vh; display: flex; align-items: center; justify-content: center; overflow: hidden; }
        
        #bg-canvas { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: -1; background: radial-gradient(circle at center, #1a052a 0%, #050505 100%); }

        .success-card {
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(15px);
            padding: 50px;
            border-radius: 35px;
            border: 1px solid var(--primary);
            text-align: center;
            max-width: 500px;
            box-shadow: 0 20px 50px rgba(106, 13, 173, 0.3);
        }

        .icon-box {
            width: 80px; height: 80px;
            background: var(--accent);
            color: var(--dark);
            border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            font-size: 40px;
            margin: 0 auto 30px;
            box-shadow: 0 0 30px var(--accent);
        }

        h1 { font-size: 2rem; margin-bottom: 15px; color: var(--white); }
        p { color: rgba(255,255,255,0.7); margin-bottom: 30px; line-height: 1.6; }

        .btn-wa {
            background: #25d366;
            color: white;
            padding: 15px 30px;
            border-radius: 50px;
            text-decoration: none;
            font-weight: 800;
            display: inline-flex;
            align-items: center;
            gap: 10px;
            transition: 0.3s;
        }
        .btn-wa:hover { transform: scale(1.05); box-shadow: 0 0 20px #25d366; }
    </style>
</head>
<body>

    <canvas id="bg-canvas"></canvas>

    <div class="success-card animate__animated animate__zoomIn">
        <div class="icon-box">
            <i class="fas fa-check"></i>
        </div>
        <h1>Assinatura Confirmada!</h1>
        <p>Seja bem-vindo à <b>Pass Soluções</b>. Sua energia agora está sob monitoramento inteligente.</p>
        
        <p style="font-size: 0.9rem;">Clique no botão abaixo para finalizar seu cadastro e ativar seu monitoramento em tempo real.</p>
        
        <a href="https://wa.me/5589981026502?text=Olá Iago! Acabei de assinar meu plano. Como faço para ativar meu monitoramento?" class="btn-wa">
            <i class="fab fa-whatsapp"></i> ATIVAR AGORA
        </a>
    </div>

    <script>
        const canvas = document.getElementById('bg-canvas');
        const ctx = canvas.getContext('2d');
        let particles = [];
        function init() { canvas.width = window.innerWidth; canvas.height = window.innerHeight; }
        class Particle {
            constructor() {
                this.x = Math.random() * canvas.width;
                this.y = Math.random() * canvas.height;
                this.size = Math.random() * 1.5;
                this.speedX = (Math.random() - 0.5) * 0.8;
                this.speedY = (Math.random() - 0.5) * 0.8;
                this.color = Math.random() > 0.5 ? '#6a0dad' : '#00e676';
            }
            update() {
                this.x += this.speedX; this.y += this.speedY;
                if (this.x > canvas.width) this.x = 0; if (this.y > canvas.height) this.y = 0;
            }
            draw() { ctx.fillStyle = this.color; ctx.globalAlpha = 0.4; ctx.beginPath(); ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2); ctx.fill(); }
        }
        function createParticles() { for (let i = 0; i < 80; i++) particles.push(new Particle()); }
        function animate() { ctx.clearRect(0, 0, canvas.width, canvas.height); particles.forEach(p => { p.update(); p.draw(); }); requestAnimationFrame(animate); }
        init(); createParticles(); animate();
    </script>
</body>
</html>
